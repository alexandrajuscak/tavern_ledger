<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121216">
  <meta name="description" content="Lightweight D&D 5e character sheets for a private campaign.">
  <title>Tavern Ledger</title>
  <link rel="icon" type="image/webp" href="assets/icons/classes/fighter.webp">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css?v=12">
  <link rel="stylesheet" href="css/styles.css?v=12">
  <!-- supabase-js 2.117.2, self-hosted (MIT, vendor/supabase-js/LICENSE): a deferred classic script: it runs before the module scripts (document order) and does not block parsing -->
  <script defer src="vendor/supabase-js/supabase-2.117.2.umd.js"></script>
  <script type="module" src="js/app.js?v=12"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/"><img class="brand-mark" src="assets/icons/classes/fighter.webp" alt="" width="26" height="26"><span class="brand-text">Tavern Ledger</span></a>
    <button type="button" class="topbar-vitals" id="topbar-vitals" hidden aria-label="Back to the top of the character sheet"></button>
    <div class="topbar-right">
      <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
      <a id="dm-link" class="btn btn-sm btn-dm" href="#/dm" hidden aria-label="DM Space"><img class="tl-icon" src="assets/icons/dm/campaign.webp" alt="" width="20" height="20"><span class="dm-link-text">DM Space</span></a>
      <span id="dm-badge" class="badge badge-dm" hidden>DM</span>
      <span id="user-name" class="user-name"></span>
      <button type="button" id="btn-signout" class="btn btn-ghost btn-sm">Sign out</button>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <div class="center-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript>Tavern Ledger needs JavaScript enabled.</noscript>
</body>
</html>
