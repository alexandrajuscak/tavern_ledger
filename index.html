<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121216">
  <meta name="description" content="Lightweight D&D 5e character sheets for a private campaign.">
  <title>Tavern Ledger</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=4">
  <script type="module" src="js/app.js?v=4"></script>
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/"><span aria-hidden="true">⚔</span> Tavern Ledger</a>
    <div class="topbar-right">
      <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
      <span id="dm-badge" class="badge badge-dm" hidden>DM</span>
      <span id="user-name" class="user-name"></span>
      <button type="button" id="btn-signout" class="btn btn-ghost btn-sm">Sign out</button>
    </div>
  </header>

  <main id="app">
    <div class="center-wrap"><div class="spinner"></div></div>
  </main>

  <div id="toasts" class="toasts"></div>

  <noscript>Tavern Ledger needs JavaScript enabled.</noscript>
</body>
</html>
